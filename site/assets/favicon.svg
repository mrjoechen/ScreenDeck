<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">ScreenDeck</title>
  <style>
    :root { --paper: #111719; --surface: #20282a; --ink: #f4efe6; --accent: #e7ff54; --danger: #ff7058; }
    .paper { fill: var(--paper); }
    .surface { fill: var(--surface); stroke: var(--ink); }
    .accent { fill: var(--accent); }
    .danger { fill: var(--danger); }
  </style>
  <rect class="paper" width="64" height="64" rx="15"/>
  <rect class="surface" x="12" y="13" width="40" height="38" rx="9" stroke-width="2"/>
  <rect class="accent" x="20" y="24" width="24" height="7" rx="3.5"/>
  <circle class="danger" cx="42" cy="42" r="4"/>
</svg>

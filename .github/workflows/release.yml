name: Release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build tagged firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-python-3.12-platformio-${{ hashFiles('platformio.ini', 'dependencies.lock', 'src/idf_component.yml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-platformio-

      - name: Install build tools
        run: python -m pip install "platformio==6.1.19" "esptool==5.1.0"

      - name: Stamp version from tag
        run: |
          set -euo pipefail
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SCREENDECK_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "SCREENDECK_BUILD_TIME=${built}" >> "$GITHUB_ENV"
          echo "SCREENDECK_CHANNEL=release" >> "$GITHUB_ENV"
          echo "SCREENDECK_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Check landing page and version guards
        run: python -m unittest tests/test_landing_page_guards.py tests/test_firmware_version.py -v

      - name: Stamp site metadata and firmware header
        run: python3 tools/screendeck_version.py stamp-site write-header

      - name: Build firmware
        run: pio run

      - name: Create web-flash factory image
        run: ./tools/merge-web-firmware.sh

      - name: Publish versioned factory image
        run: python3 tools/screendeck_version.py copy-factory stamp-site

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist-release
          factory="site/firmware/esp32-s3-4848s040/screendeck-esp32s3-4848s040-factory.bin"
          versioned="$(python3 -c 'import json; print(json.load(open("site/firmware/release.json"))["factoryImage"].lstrip("./"))')"
          test -s "${factory}"
          cp "${factory}" "dist-release/screendeck-esp32s3-4848s040-factory.bin"
          cp "site/firmware/esp32-s3-4848s040/${versioned}" "dist-release/${versioned}"
          cp .pio/build/esp32s3/firmware.bin dist-release/screendeck-esp32s3-4848s040-app.bin
          cp site/firmware/release.json dist-release/release.json
          (cd dist-release && sha256sum * > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(dist-release/*)
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" \
              --title "ScreenDeck ${tag}" \
              --generate-notes \
              "${assets[@]}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Do not attach the github-pages environment here. GitHub creates that
    # environment with a default-branch-only rule, which rejects tag refs
    # before any step runs. pages: write + id-token: write are enough for
    # actions/deploy-pages.
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

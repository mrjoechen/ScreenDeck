name: Deploy GitHub Pages

# Publishes site/ to https://mrjoechen.github.io/ScreenDeck/
# Set Settings → Pages → Source to GitHub Actions (or let the first
# actions/deploy-pages run create that configuration).

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Latest GitHub Release firmware is attached so a main-branch site update
# does not replace a tagged factory image.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build firmware and site
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-python-3.12-platformio-${{ hashFiles('platformio.ini', 'dependencies.lock', 'src/idf_component.yml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-platformio-

      - name: Install build tools
        run: python -m pip install "platformio==6.1.19" "esptool==5.1.2"

      - name: Check landing page and version guards
        run: python -m unittest tests/test_landing_page_guards.py tests/test_firmware_version.py -v

      - name: Attach latest released firmware or build a development image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          firmware_dir="site/firmware/esp32-s3-4848s040"
          mkdir -p "${firmware_dir}"
          tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' || true)"

          if [ -n "${tag}" ]; then
            echo "Using GitHub Release ${tag}"
            gh release download "${tag}" \
              --dir "${firmware_dir}" \
              --pattern "screendeck-esp32s3-4848s040-factory.bin" \
              --clobber
            mkdir -p /tmp/screendeck-release
            if gh release download "${tag}" \
              --dir /tmp/screendeck-release \
              --pattern "release.json" \
              --clobber; then
              cp /tmp/screendeck-release/release.json site/firmware/release.json
              python3 tools/screendeck_version.py apply-json site/firmware/release.json
            else
              published="$(gh release view "${tag}" --json publishedAt --jq .publishedAt)"
              SCREENDECK_VERSION="${tag}" \
              SCREENDECK_CHANNEL=release \
              SCREENDECK_TAG="${tag}" \
              SCREENDECK_BUILD_TIME="${published}" \
                python3 tools/screendeck_version.py stamp-site
            fi
            python3 tools/screendeck_version.py copy-factory
            factory_rel="$(python3 -c 'import json; print(json.load(open("site/firmware/release.json"))["factoryImage"].lstrip("./"))')"
            test -s "${firmware_dir}/${factory_rel}"
            python3 -m esptool --chip esp32s3 image-info \
              "${firmware_dir}/screendeck-esp32s3-4848s040-factory.bin"
          else
            echo "No GitHub Release yet; building development firmware from this commit"
            python3 tools/screendeck_version.py stamp-site write-header
            pio run
            ./tools/merge-web-firmware.sh
          fi
          test -s "${firmware_dir}/screendeck-esp32s3-4848s040-factory.bin"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
